version: '3.8'
services:
  db:
    image: postgres:16-alpine
    container_name: klim-bot-db
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER:-user}
      POSTGRES_PASSWORD: ${DATABASE_PASS:-password}
      POSTGRES_DB: ${DATABASE_NAME:-new-yog-bot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:${DATABASE_PORT:-5433}:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-user} -d ${DATABASE_NAME:-new-yog-bot}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    # CI publishes this image to GHCR; server pulls it (see .github/workflows/deploy.yml).
    # `build:` stays for local dev (`make deploy` / `up --build` builds & tags the same name).
    image: ghcr.io/nrepeat/yogcardgate-telegram-bot:latest
    build:
      context: .
      labels:
        - "image-name=klim-bot"
    container_name: klim-bot-app
    restart: always
    ports:
      - '${PORT:-3005}:${PORT:-3005}'
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${DATABASE_USER:-user}:${DATABASE_PASS:-password}@db:5432/${DATABASE_NAME:-new-yog-bot}?schema=public"
    env_file:
      - .env

  seed:
    build:
      context: .
    container_name: klim-bot-seed
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${DATABASE_USER:-user}:${DATABASE_PASS:-password}@db:5432/${DATABASE_NAME:-new-yog-bot}?schema=public"
    env_file:
      - .env
    entrypoint: sh -c "npx prisma migrate deploy && npm run seed"
    profiles:
      - seed
  seed-vendor:
    build:
      context: .
    container_name: klim-bot-seed
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${DATABASE_USER:-user}:${DATABASE_PASS:-password}@db:5432/${DATABASE_NAME:-new-yog-bot}?schema=public"
    env_file:
      - .env
    entrypoint: sh -c "npx prisma migrate deploy && npm run seed:vendors"
    profiles:
      - seed

volumes:
  postgres_data:
