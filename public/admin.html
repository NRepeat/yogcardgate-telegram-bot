<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1117; color: #e1e4e8; padding: 20px; }
  h1 { margin-bottom: 20px; font-size: 22px; }
  .auth { max-width: 400px; margin: 100px auto; }
  .auth input { width: 100%; padding: 12px; background: #1c1f26; border: 1px solid #333; border-radius: 8px; color: #e1e4e8; font-size: 16px; margin-bottom: 12px; }
  .auth button { width: 100%; padding: 12px; background: #3b82f6; border: none; border-radius: 8px; color: #fff; font-size: 16px; cursor: pointer; }
  .auth button:hover { background: #2563eb; }
  .tabs { display: flex; gap: 4px; margin-bottom: 20px; }
  .tab { padding: 10px 24px; border-radius: 8px 8px 0 0; border: none; background: #1c1f26; color: #8b949e; font-size: 14px; font-weight: 600; cursor: pointer; }
  .tab.active { background: #21262d; color: #e1e4e8; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid #1c1f26; }
  th { background: #1c1f26; color: #8b949e; font-weight: 500; font-size: 13px; text-transform: uppercase; position: sticky; top: 0; }
  tr:hover { background: #161b22; }
  tr.disabled { opacity: 0.5; }
  .role-btn { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; margin: 2px; cursor: pointer; border: 2px solid transparent; transition: all 0.15s; }
  .role-btn.active { border-color: currentColor; }
  .role-btn.ADMIN { color: #58a6ff; background: #1f6feb33; }
  .role-btn.ADMIN.active { background: #1f6feb66; }
  .role-btn.WORKER { color: #3fb950; background: #23863633; }
  .role-btn.WORKER.active { background: #23863666; }
  .role-btn.GUEST { color: #8b949e; background: #6e768133; }
  .role-btn.GUEST.active { background: #6e768166; }
  .toggle-btn { padding: 6px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; border: none; }
  .toggle-btn.on { background: #23863633; color: #3fb950; }
  .toggle-btn.off { background: #da363333; color: #f85149; }
  .status { margin: 10px 0; padding: 10px; border-radius: 8px; display: none; font-size: 14px; }
  .status.success { display: block; background: #23863633; color: #3fb950; }
  .status.error { display: block; background: #da363333; color: #f85149; }
  .tg-id { color: #8b949e; font-size: 13px; }
  .token { color: #8b949e; font-size: 12px; font-family: monospace; }
  .rate-input { width: 90px; padding: 4px 8px; background: #1c1f26; border: 1px solid #333; border-radius: 6px; color: #e1e4e8; font-size: 13px; font-family: monospace; text-align: right; }
  .rate-input:focus { border-color: #3b82f6; outline: none; }
  .rate-input.changed { border-color: #d29922; }
  .save-btn { padding: 4px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; border: none; background: #3b82f6; color: #fff; }
  .save-btn:hover { background: #2563eb; }
  .group-header { background: #161b22; }
  .group-header td { font-weight: 600; font-size: 14px; padding: 8px 14px; color: #8b949e; }
  .xml-tag { font-size: 11px; color: #6e7681; font-family: monospace; }
</style>
</head>
<body>

<div id="auth-screen" class="auth">
  <h1>Admin Panel</h1>
  <input type="password" id="token-input" placeholder="API Token" />
  <button onclick="login()">Login</button>
</div>

<div id="app" style="display:none">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('rates', this)">Rates</button>
    <button class="tab" onclick="switchTab('users', this)">Users</button>
    <button class="tab" onclick="switchTab('vendors', this)">Vendors</button>
  </div>
  <div id="status" class="status"></div>

  <div id="tab-rates" class="tab-content active">
    <table>
      <thead>
        <tr><th>Currency</th><th>Method</th><th>Range</th><th>Rate</th><th>Status</th><th></th></tr>
      </thead>
      <tbody id="rates-body"></tbody>
    </table>
  </div>

  <div id="tab-users" class="tab-content">
    <table>
      <thead>
        <tr><th>User</th><th>Telegram ID</th><th>Roles</th><th>Status</th></tr>
      </thead>
      <tbody id="users-body"></tbody>
    </table>
  </div>

  <div id="tab-vendors" class="tab-content">
    <table>
      <thead>
        <tr><th>Vendor</th><th>Chat ID</th><th>Token</th><th>Work</th><th>Receipt</th></tr>
      </thead>
      <tbody id="vendors-body"></tbody>
    </table>
  </div>
</div>

<script>
const API_BASE = window.location.origin;
let TOKEN = '';
let ALL_ROLES = [];

async function api(path, opts = {}) {
  const res = await fetch(API_BASE + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'X-API-TOKEN': TOKEN, ...opts.headers },
  });
  if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
  return res.json();
}

function showStatus(msg, type) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + type;
  setTimeout(() => el.className = 'status', 3000);
}

function switchTab(name, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  btn.classList.add('active');
  if (name === 'rates') loadRates();
  if (name === 'vendors') loadVendors();
  if (name === 'users') loadUsers();
}

async function login() {
  TOKEN = document.getElementById('token-input').value;
  try {
    ALL_ROLES = await api('/api/users/roles');
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadRates();
  } catch (e) {
    alert('Invalid token');
  }
}

// === RATES ===
async function loadRates() {
  const rates = await api('/api/rates');
  const tbody = document.getElementById('rates-body');
  tbody.innerHTML = '';

  // Group by currency:method
  const groups = new Map();
  for (const r of rates) {
    const key = r.currency + ':' + r.method;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(r);
  }

  for (const [key, items] of groups) {
    // Sort: highest minAmount first
    items.sort((a, b) => b.minAmount - a.minAmount);
    const allDisabled = items.every(r => !r.enabled);

    // Group header
    const htr = document.createElement('tr');
    htr.className = 'group-header';
    const xml = items[0].xml || '';
    htr.innerHTML = `<td colspan="6">${key} ${xml ? '<span class="xml-tag">' + xml + '</span>' : ''}
      <button class="toggle-btn ${allDisabled ? 'off' : 'on'}" onclick="toggleGroup('${key}', ${allDisabled})" style="margin-left:10px;font-size:11px">${allDisabled ? 'ALL OFF' : 'ALL ON'}</button></td>`;
    tbody.appendChild(htr);

    for (const r of items) {
      const tr = document.createElement('tr');
      tr.className = r.enabled ? '' : 'disabled';
      const range = r.maxAmount > 0 ? `${r.minAmount} - ${r.maxAmount}` : `${r.minAmount}+`;
      tr.innerHTML = `
        <td>${r.currency}</td>
        <td>${r.method}</td>
        <td>
          <input class="rate-input" style="width:70px" value="${r.minAmount}" onchange="markChanged(this)" data-id="${r.id}" data-field="minAmount" /> -
          <input class="rate-input" style="width:70px" value="${r.maxAmount}" onchange="markChanged(this)" data-id="${r.id}" data-field="maxAmount" />
        </td>
        <td><input class="rate-input" value="${r.rate}" onchange="markChanged(this)" data-id="${r.id}" data-field="rate" /></td>
        <td><button class="toggle-btn ${r.enabled ? 'on' : 'off'}" onclick="toggleRate('${r.id}', ${!r.enabled})">${r.enabled ? 'ON' : 'OFF'}</button></td>
        <td><button class="save-btn" onclick="saveRate('${r.id}')">Save</button></td>
      `;
      tbody.appendChild(tr);
    }
  }
}

function markChanged(el) {
  el.classList.add('changed');
}

async function saveRate(id) {
  const inputs = document.querySelectorAll(`input[data-id="${id}"]`);
  const body = {};
  for (const input of inputs) {
    const field = input.dataset.field;
    const val = parseFloat(input.value);
    if (!isNaN(val)) body[field] = val;
    input.classList.remove('changed');
  }
  try {
    const updated = await api(`/api/rates/${id}`, { method: 'PUT', body: JSON.stringify(body) });
    showStatus(`${updated.currency}:${updated.method} updated`, 'success');
    loadRates();
  } catch (e) { showStatus('Error: ' + e.message, 'error'); }
}

async function toggleRate(id, enabled) {
  try {
    await api(`/api/rates/${id}`, { method: 'PUT', body: JSON.stringify({ enabled }) });
    showStatus(enabled ? 'Enabled' : 'Disabled', 'success');
    loadRates();
  } catch (e) { showStatus('Error: ' + e.message, 'error'); }
}

async function toggleGroup(key, enable) {
  const rates = await api('/api/rates');
  const group = rates.filter(r => r.currency + ':' + r.method === key);
  for (const r of group) {
    await api(`/api/rates/${r.id}`, { method: 'PUT', body: JSON.stringify({ enabled: enable }) });
  }
  showStatus(`${key} ${enable ? 'enabled' : 'disabled'}`, 'success');
  loadRates();
}

// === USERS ===
async function loadUsers() {
  const users = await api('/api/users');
  const tbody = document.getElementById('users-body');
  tbody.innerHTML = '';
  for (const u of users) {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><strong>@${u.username}</strong></td>
      <td class="tg-id">${u.telegramId}</td>
      <td>${renderRoles(u)}</td>
      <td><button class="toggle-btn ${u.onPause ? 'off' : 'on'}" onclick="togglePause('${u.id}', ${!u.onPause})">${u.onPause ? 'Paused' : 'Active'}</button></td>
    `;
    tbody.appendChild(tr);
  }
}

function renderRoles(user) {
  return ALL_ROLES.map(r => {
    const active = user.roles.includes(r.name);
    return `<button class="role-btn ${r.name} ${active ? 'active' : ''}" onclick="toggleRole('${user.id}', '${r.name}', ${!active})">${r.name}</button>`;
  }).join('');
}

async function toggleRole(userId, role, add) {
  try {
    const users = await api('/api/users');
    const user = users.find(u => u.id === userId);
    let roles = [...user.roles];
    if (add && !roles.includes(role)) roles.push(role);
    if (!add) roles = roles.filter(r => r !== role);
    const updated = await api(`/api/users/${userId}/roles`, { method: 'PUT', body: JSON.stringify({ roles }) });
    showStatus(`@${updated.username}: ${updated.roles.join(', ')}`, 'success');
    loadUsers();
  } catch (e) { showStatus('Error: ' + e.message, 'error'); }
}

async function togglePause(userId, pause) {
  try {
    const updated = await api(`/api/users/${userId}/pause`, { method: 'PUT', body: JSON.stringify({ onPause: pause }) });
    showStatus(`@${updated.username} ${updated.onPause ? 'paused' : 'active'}`, 'success');
    loadUsers();
  } catch (e) { showStatus('Error: ' + e.message, 'error'); }
}

// === VENDORS ===
async function loadVendors() {
  const vendors = await api('/api/vendors');
  const tbody = document.getElementById('vendors-body');
  tbody.innerHTML = '';
  for (const v of vendors) {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><strong>${v.title}</strong></td>
      <td class="tg-id">${v.chatId}</td>
      <td class="token">${v.token || '-'}</td>
      <td><button class="toggle-btn ${v.work ? 'on' : 'off'}" onclick="toggleWork('${v.id}', ${!v.work})">${v.work ? 'ON' : 'OFF'}</button></td>
      <td><button class="toggle-btn ${v.showReceipt ? 'on' : 'off'}" onclick="toggleReceipt('${v.id}', ${!v.showReceipt})">${v.showReceipt ? 'ON' : 'OFF'}</button></td>
    `;
    tbody.appendChild(tr);
  }
}

async function toggleWork(vendorId, work) {
  try {
    const updated = await api(`/api/vendors/${vendorId}/work`, { method: 'PUT', body: JSON.stringify({ work }) });
    showStatus(`${updated.title} work: ${updated.work ? 'ON' : 'OFF'}`, 'success');
    loadVendors();
  } catch (e) { showStatus('Error: ' + e.message, 'error'); }
}

async function toggleReceipt(vendorId, show) {
  try {
    const updated = await api(`/api/vendors/${vendorId}/receipt`, { method: 'PUT', body: JSON.stringify({ showReceipt: show }) });
    showStatus(`${updated.title} receipt: ${updated.showReceipt ? 'ON' : 'OFF'}`, 'success');
    loadVendors();
  } catch (e) { showStatus('Error: ' + e.message, 'error'); }
}
</script>
</body>
</html>
